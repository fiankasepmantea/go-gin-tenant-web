# Weekly update PRs. CI (check, audit, docker) runs on each of them, so a bad update is visible before it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # These majors are planned upgrades, not automatic PRs. Each one needs a decision first:
      #  - next and eslint-config-next move together (read the Next.js migration guide);
      #  - eslint 9+ needs the flat config format, which `next lint` and .eslintrc.json do not use yet;
      #  - @types/node follows the Node major that CI and the Docker image run (22);
      #  - typescript: wait until the Next.js version in use supports the new major.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node line the project supports (see package.json "engines" and the CI Node version).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
