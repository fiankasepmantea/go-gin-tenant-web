name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # Needs a committed package-lock.json (run `npm install` once and commit it).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          API_URL: http://localhost:8080

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: dependencies with known high severity issues
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: the production image builds
        run: docker build -t go-gin-tenant-web:ci .
      - name: the container starts and answers on /login
        run: |
          docker run -d --name web -p 3000:3000 -e API_URL=http://localhost:8080 go-gin-tenant-web:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          docker logs web
          exit 1
